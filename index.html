<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Stack</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        font-family: Arial, sans-serif;
      }

      #initial-loader .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #e3eaf4;
        border-top-color: #e93683;
        border-radius: 50%;
        animation: dev-stack-spin 0.8s linear infinite;
      }

      #initial-loader p {
        color: #64748b;
        font-size: 14px;
      }

      @keyframes dev-stack-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader" role="status" aria-label="Loading Dev Stack">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading Dev Stack...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
